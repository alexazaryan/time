<!doctype html>
<html lang="ru">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
         http-equiv="Cache-Control"
         content="no-cache, no-store, must-revalidate"
      />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />

      <title>mytimenow.pro</title>

      <meta property="og:title" content="mytimenow.pro" />
      <meta property="og:description" content="Узнай точное время за $1" />
      <meta property="og:image" content="https://mytimenow.pro/favicon.png" />
      <meta property="og:url" content="https://mytimenow.pro/" />
      <meta property="og:type" content="website" />

      <link rel="icon" type="image/png" href="favicon.png" />
      <link rel="stylesheet" href="style.css" />
   </head>
   <body>
      <!-- ЭКРАН РЕКЛАМЫ (3 СЕКУНДЫ) -->
      <div class="screen active" id="screen-ad">
         <div class="ad-box">
            <div class="ad-placeholder">Тут может быть ваша реклама</div>
            <div class="ad-count" id="ad-count">3</div>
         </div>
      </div>

      <!-- ЭКРАН ОПЛАТЫ -->
      <div class="screen" id="screen-pay">
         <div class="pay-card">
            <div class="pay-title" style="font-size: 24px">
               Узнать актуальное время
            </div>
            <div
               style="
                  font-size: 18px;
                  color: #d81b8f;
                  margin-bottom: 12px;
                  font-weight: 600;
               "
            >
               👥 Узнай, сколько людей уже знают время
            </div>
            <div class="price-tag">$1.00</div>

            <!-- Ссылка на оплату Lava -->
            <a
               href="https://app.lava.top/products/466bc0bd-9f58-45b7-8d76-e0318e279566"
               class="pay-btn"
               style="display: block; text-decoration: none; text-align: center"
            >
               Оплатить
            </a>
         </div>

         <!-- ОФЕРТА СНИЗУ ЭКРАНА, ТОЛЬКО НА ЭКРАНЕ ОПЛАТЫ -->
         <div class="pay-footer">
            <div style="font-size: 13px; color: #bbb; margin-top: 10px">
               Контакты: alexnuts414@gmail.com
            </div>
            <p style="margin: 0; font-size: 11px; color: #bbb">
               Условия: после оплаты вы увидите время. Стоимость: $1.00.
            </p>
         </div>
      </div>

      <!-- ЭКРАН РЕЗУЛЬТАТА -->
      <div class="screen" id="screen-result">
         <div class="result-time" id="result-time">--:--:--</div>
         <div
            class="counter-block"
            style="font-size: 18px; color: #d81b8f; font-weight: 600"
         >
            <!-- Нас уже -->
            👥 Нас уже: <span id="counter">47</span> человек
         </div>
      </div>

      <script src="script.js"></script>
   </body>
</html>
