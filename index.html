<!doctype html>
<html lang="ru">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
         http-equiv="Cache-Control"
         content="no-cache, no-store, must-revalidate"
      />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />

      <title>mytimenow.pro</title>

      <meta property="og:title" content="mytimenow.pro" />
      <meta property="og:description" content="Узнай время за $1" />
      <meta property="og:image" content="https://mytimenow.pro/favicon.png" />
      <meta property="og:url" content="https://mytimenow.pro/" />
      <meta property="og:type" content="website" />

      <link rel="icon" type="image/png" href="favicon.png" />
      <link rel="stylesheet" href="style.css" />
   </head>
   <body>
      <!-- ЭКРАН РЕКЛАМЫ (3 СЕКУНДЫ) -->
      <div class="screen active" id="screen-ad">
         <div class="ad-label"><h3>Тут может быть ваша реклама</h3></div>
         <div class="ad-box">
            <a
               href="https://azacode.pro"
               target="_blank"
               rel="noopener"
               class="ad-link"
            >
               <img
                  src="azacode.png"
                  alt="AzaCode — интернет-магазин под ключ"
                  class="ad-image"
               />
            </a>
            <div class="ad-count" id="ad-count">3</div>
         </div>
      </div>

      <!-- ЭКРАН ОПЛАТЫ -->
      <div class="screen" id="screen-pay">
         <div class="pay-card">
            <div class="pay-title" style="font-size: 24px">
               Узнать актуальное время
            </div>
            <div
               style="
                  font-size: 18px;
                  color: #d81b8f;
                  margin-bottom: 12px;
                  font-weight: 600;
               "
            >
               👥 Узнай, сколько людей уже сделали это
            </div>
            <div class="price-tag">$1.00</div>

            <!-- Выбор способа оплаты по стране -->
            <div id="pay-buttons">
               <label for="country-select" class="country-label">
                  Выберите способ оплаты
               </label>
               <select id="country-select" class="country-select">
                  <option value="" disabled selected>— Выберите —</option>
                  <option value="AZ">🇦🇿 Азербайджан</option>
                  <option value="AM">🇦🇲 Армения</option>
                  <option value="BY">🇧🇾 Беларусь</option>
                  <option value="DE">🇩🇪 Германия</option>
                  <option value="GE">🇬🇪 Грузия</option>
                  <option value="KZ">🇰🇿 Казахстан</option>
                  <option value="MD">🇲🇩 Молдова</option>
                  <option value="PL">🇵🇱 Польша</option>
                  <option value="RU">🇷🇺 Россия</option>
                  <option value="US">🇺🇸 США</option>
                  <option value="TR">🇹🇷 Турция</option>
                  <option value="UZ">🇺🇿 Узбекистан</option>
                  <option value="UA">🇺🇦 Украина</option>
                  <option value="OTHER">🌍 Другая страна (скоро)</option>
               </select>
               <div id="pay-notice" style="display: none"></div>
               <a
                  id="pay-link"
                  class="pay-btn"
                  href="#"
                  style="
                     display: block;
                     text-decoration: none;
                     text-align: center;
                  "
               >
                  Оплатить
               </a>
               <a
                  href="https://nowpayments.io/donation?api_key=5328ee10-5326-4854-81a2-0ce7cd78aacf"
                  target="_blank"
                  rel="noopener"
                  class="crypto-support-btn"
               >
                  <svg
                     class="crypto-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                  >
                     <circle cx="12" cy="12" r="10" fill="#F7931A" />
                     <path
                        d="M16.5 10.6c.2-1.4-.9-2.2-2.3-2.7l.5-1.9-1.1-.3-.5 1.8c-.3-.1-.6-.1-.9-.2l.5-1.9-1.1-.3-.5 1.9c-.2-.1-.5-.1-.7-.2v0l-1.5-.4-.3 1.2s.8.2.8.2c.5.1.5.4.5.7l-.6 2.2v0l-.8 3.1c-.1.1-.2.4-.6.3 0 0-.8-.2-.8-.2l-.5 1.3 1.4.4c.3.1.5.1.8.2l-.5 2 1.1.3.5-1.9c.3.1.6.2.9.2l-.5 1.9 1.1.3.5-2c1.9.4 3.3.2 3.9-1.5.5-1.4 0-2.1-1-2.6.7-.2 1.3-.6 1.4-1.6zm-2.5 3.5c-.3 1.4-2.7.6-3.5.4l.6-2.5c.8.2 3.2.6 2.9 2.1zm.4-3.5c-.3 1.3-2.3.6-2.9.5l.6-2.3c.6.1 2.6.4 2.3 1.8z"
                        fill="#fff"
                     />
                  </svg>
                  Донат в крипте
               </a>
            </div>
         </div>

         <!-- ОФЕРТА СНИЗУ ЭКРАНА, ТОЛЬКО НА ЭКРАНЕ ОПЛАТЫ -->
         <div class="pay-footer">
            <div style="font-size: 13px; color: #bbb; margin-top: 10px">
               Контакты: alexnuts414@gmail.com
            </div>
            <p style="margin: 0; font-size: 11px; color: #bbb">
               Условия: после оплаты вы увидите время. Стоимость: $1.00.
            </p>
         </div>
      </div>

      <!-- ЭКРАН РЕЗУЛЬТАТА -->
      <div class="screen" id="screen-result">
         <canvas id="matrix-canvas"></canvas>
         <div class="clock-wrap">
            <div class="clock-digits" id="clock-digits"></div>
         </div>
         <div
            class="counter-block"
            style="font-size: 18px; color: #d81b8f; font-weight: 600"
         >
            👥 Нас уже: <span id="counter">2147</span> человек
         </div>
      </div>

      <script src="script.js"></script>
   </body>
</html>
